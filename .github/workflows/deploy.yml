# Build the static site from the stored snapshots and publish it to GitHub Pages.
# Runs on every push to main (code or data) and is also called by the daily job.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: commit to build (defaults to the triggering commit)
        type: string
        required: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: uv sync
      - name: Export analytics JSON from stored snapshots
        run: uv run etftracker build -o web/public/data
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/configure-pages@v5
        with:
          enablement: true  # creates the Pages site (source: GitHub Actions) on first run
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
