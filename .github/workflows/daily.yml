# Daily capture: download each fund's holdings file, commit new snapshots to main,
# then rebuild and deploy the site. Fund files are typically refreshed in the evening
# (US Eastern) after the close, so we fetch early the next morning and once more
# mid-morning as a retry; unchanged files are skipped, so extra runs are harmless.
name: daily-fetch
on:
  schedule:
    - cron: "15 7 * * 1-6"   # 07:15 UTC = 03:15 ET (Tue-Sat covers Mon-Fri closes)
    - cron: "15 13 * * 1-6"  # 13:15 UTC retry
  workflow_dispatch:
    inputs:
      funds:
        description: space-separated tickers to fetch (blank = all)
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: daily-fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync
      - name: Fetch holdings
        run: uv run etftracker fetch --fail-on-error ${{ inputs.funds }}
      - name: Commit new snapshots
        id: commit
        run: |
          git config user.name "etftracker-bot"
          git config user.email "etftracker-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "No new snapshots."
            exit 0
          fi
          git commit -m "data: holdings captured $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((i * 5))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.fetch.outputs.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
